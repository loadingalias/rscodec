[package]
name = "rscodec"
version = "0.1.0"
description = "Allocation-free base64, base64url, hex, and JSON with portable and SIMD backends."
repository = "https://github.com/loadingalias/rscodec"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
keywords = ["base64", "hex", "json", "simd", "no-std"]
categories = ["encoding", "no-std", "no-std::no-alloc", "parser-implementations"]
include = ["/src", "/examples", "/docs/content", "/LICENSE", "/README.md"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[features]
default = ["std"]
std = []
base64 = []
hex = []
json = []

[lints]
workspace = true

[dev-dependencies]
rscodec = { path = ".", default-features = false, features = ["base64", "hex", "json"] }
criterion = { version = "=0.8.2", default-features = false }
base16ct = "=1.0.0"
# `simd-unsafe`, a default feature, gives the `Simd` engine.
base64 = "=0.23.1"
base64-ng = { version = "=2.1.0", features = ["simd"] }
base64-simd = "=0.8.0"
# The SIMD kernels are always on. `unstable` exposes the AVX2 kernel, which the x86_64 rows select.
base64-turbo = { version = "=0.6.0", features = ["unstable"] }
base64ct = "=1.8.3"
const-hex = "=1.19.3"
data-encoding = "=2.11.1"
encodify = "=1.0.2"
faster-hex = { version = "=1.0.0", default-features = false, features = ["std"] }
flexon = { version = "=0.4.9", features = ["nightly"] }
# The `num-bigint` default feature only widens integers past i64.
jiter = { version = "=0.19.0", default-features = false }
ryu = "=1.0.23"
serde = { version = "=1.0.229", features = ["derive"] }
# Without float_roundtrip, serde_json misses correct rounding by 1 ULP for 11,975 of 111,080 canada.json floats.
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
# Without runtime-detection, simd-json selects the native kernel at compile time.
simd-json = { version = "=0.19.0", default-features = false, features = ["serde_impl", "swar-number-parsing"] }
# `avx512` takes effect only where `-C target-cpu` enables AVX-512.
sonic-rs = { version = "=0.5.11", features = ["avx512"] }
zmij = "=1.0.23"

[target.'cfg(not(any(target_env = "msvc", target_family = "wasm")))'.dev-dependencies]
simdutf = "=0.7.0"

[[example]]
name = "base64url"
required-features = ["base64"]

[[example]]
name = "jose_header"
required-features = ["json"]

[[example]]
name = "sparse_index"
required-features = ["json"]

[[example]]
name = "ceremony_options"
required-features = ["json", "base64"]

[[bench]]
name = "base_n"
harness = false

[[bench]]
name = "json"
harness = false

[workspace]
resolver = "3"
members = [".", "ct", "xtask"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.101"

[workspace.lints.cargo]
unknown_lints = "deny"
unused_workspace_dependencies = "deny"

[workspace.lints.rust]
warnings = "deny"
ambiguous_negative_literals = "deny"
c_void_returns = "deny"
invalid_runtime_symbol_definitions = "deny"
raw_borrows_via_references = "deny"
suspicious_runtime_symbol_definitions = "deny"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = "deny"
unsafe_code = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
default = { level = "deny", priority = -1 }

arc_with_non_send_sync = "deny"
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
non_send_fields_in_send_ty = "deny"
significant_drop_in_scrutinee = "deny"

panic = "deny"
string_slice = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

assertions_on_result_states = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"

cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
fn_to_numeric_cast_any = "deny"
invalid_upcast_comparisons = "deny"
lossy_float_literal = "deny"

allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
enum_glob_use = "deny"
expl_impl_clone_on_copy = "deny"
iter_not_returning_iterator = "deny"
same_functions_in_if_condition = "deny"

alloc_instead_of_core = "deny"
std_instead_of_core = "deny"

print_stderr = "deny"
print_stdout = "deny"

negative_feature_names = "deny"
wildcard_dependencies = "deny"

coerce_container_to_any = "deny"
collection_is_never_read = "deny"
debug_assert_with_mut_call = "deny"
literal_string_with_formatting_args = "deny"
or_fun_call = "deny"
path_buf_push_overwrite = "deny"
read_zero_byte_vec = "deny"
redundant_clone = "deny"
suspicious_operation_groupings = "deny"
trait_duplication_in_bounds = "deny"
transmute_undefined_repr = "deny"
uninhabited_references = "deny"
volatile_composites = "deny"

as_ptr_cast_mut = "deny"
as_pointer_underscore = "deny"
borrow_as_ptr = "deny"
cast_ptr_alignment = "deny"
mem_forget = "deny"
missing_safety_doc = "deny"
ptr_as_ptr = "deny"
ptr_cast_constness = "deny"
ref_as_ptr = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[profile.release]
overflow-checks = true

# Cargo applies this override to dependencies outside the workspace.
[profile.bench.package."*"]
overflow-checks = false

[profile.test.package.rscodec]
opt-level = 3

[profile.test.package.data-encoding]
opt-level = 3
