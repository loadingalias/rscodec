[package]
name = "rscodec"
version = "0.1.0-alpha.2"
description = "Codecs for Rust (in development). Each codec is a leaf feature with portable and SIMD backends and no C."
repository = "https://github.com/loadingalias/rscodec"
edition.workspace = true
license.workspace = true
# The first release is a later task.
publish = false
# The crate is at the workspace root: the package holds only its sources, its license, and its
# README.
include = ["/src", "/LICENSE", "/README.md"]

[features]
default = ["std"]
# Without `std`, the crate needs only `core`. Each codec is a leaf feature, which the task of that
# codec adds.
std = []

[lints]
workspace = true

# The competitors of `benches/`. None enters the library closure. Each is pinned to a release at
# least 7 days old, in its fastest configuration.
[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false }
# base-N
base16ct = "=1.0.0"
# `simd-unsafe`, a default feature, gives the `Simd` engine.
base64 = "=0.23.1"
base64-ng = { version = "=2.1.0", features = ["simd"] }
base64-simd = "=0.8.0"
# The SIMD kernels are always on. `unstable` exposes the AVX2 kernel, which the x86_64 rows select.
base64-turbo = { version = "=0.6.0", features = ["unstable"] }
base64ct = "=1.8.3"
const-hex = "=1.19.3"
data-encoding = "=2.11.1"
encodify = "=1.0.2"
faster-hex = { version = "=1.0.0", default-features = false, features = ["std"] }
# JSON and float printers
flexon = { version = "=0.4.9", features = ["nightly"] }
# The `num-bigint` default feature only widens integers past i64.
jiter = { version = "=0.19.0", default-features = false }
ryu = "=1.0.23"
# Without `float_roundtrip`, serde_json reads 11,975 of the 111,080 floats of canada.json 1 ULP
# away from the correctly rounded value. The bar takes only correct output.
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
# The default features without `runtime-detection`: `-C target-cpu=native` selects the kernel at
# compile time, with no dispatch.
simd-json = { version = "=0.19.0", default-features = false, features = ["serde_impl", "swar-number-parsing"] }
# `avx512` takes effect only where `-C target-cpu` enables AVX-512.
sonic-rs = { version = "=0.5.10", features = ["avx512"] }
zmij = "=1.0.23"

# simdutf, the C++ leader of base64 decode, through its binding crate. A build for MSVC cannot
# compile it on another host, so `cargo xtask check --target x86_64-pc-windows-msvc` leaves it out.
[target.'cfg(not(target_env = "msvc"))'.dev-dependencies]
simdutf = "=0.7.0"

[[bench]]
name = "base_n"
harness = false

[[bench]]
name = "json"
harness = false

[workspace]
resolver = "3"
members = [".", "xtask"]

# No `rust-version`: development requires the nightly pinned in
# rust-toolchain.toml, which a release number cannot express.
[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.lints.cargo]
unknown_lints = "deny"
unused_workspace_dependencies = "deny"

[workspace.lints.rust]
warnings = "deny"
ambiguous_negative_literals = "deny"
c_void_returns = "deny"
invalid_runtime_symbol_definitions = "deny"
raw_borrows_via_references = "deny"
suspicious_runtime_symbol_definitions = "deny"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = "deny"
# Unsafe code is denied everywhere. Each necessary unsafe region is the
# smallest private module or item, with a reasoned `#[expect(unsafe_code)]`.
unsafe_code = "deny"
# Library documentation and `Debug` coverage.
missing_docs = "deny"
missing_debug_implementations = "deny"
# Visibility says what is API: nothing `pub` that the crate root cannot reach.
unreachable_pub = "deny"

[workspace.lints.clippy]
# The complete production-ready default set. The negative priority lets every
# individually reviewed lint below take precedence.
default = { level = "deny", priority = -1 }

# Concurrency and async correctness.
arc_with_non_send_sync = "deny"
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
non_send_fields_in_send_ty = "deny"
significant_drop_in_scrutinee = "deny"

# Production panics and incomplete control flow.
panic = "deny"
string_slice = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

# Dropped work, errors, and weak test diagnostics.
assertions_on_result_states = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"

# Numeric conversions and literals must make loss and sign changes explicit.
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
fn_to_numeric_cast_any = "deny"
invalid_upcast_comparisons = "deny"
lossy_float_literal = "deny"

# API clarity and maintainability.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
enum_glob_use = "deny"
expl_impl_clone_on_copy = "deny"
iter_not_returning_iterator = "deny"
same_functions_in_if_condition = "deny"

# Import from `core` when the item is there; it keeps a later `no_std` split open.
alloc_instead_of_core = "deny"
std_instead_of_core = "deny"

# Libraries report through return values, not direct output. xtask, the one
# command-line tool, carries a reasoned `expect`.
print_stderr = "deny"
print_stdout = "deny"

# Cargo semantics. Do not enable clippy::cargo wholesale.
negative_feature_names = "deny"
wildcard_dependencies = "deny"

# High-signal nursery lints selected individually.
coerce_container_to_any = "deny"
collection_is_never_read = "deny"
debug_assert_with_mut_call = "deny"
literal_string_with_formatting_args = "deny"
or_fun_call = "deny"
path_buf_push_overwrite = "deny"
read_zero_byte_vec = "deny"
redundant_clone = "deny"
suspicious_operation_groupings = "deny"
trait_duplication_in_bounds = "deny"
transmute_undefined_repr = "deny"
uninhabited_references = "deny"
volatile_composites = "deny"

# Unsafe-code proof obligations and destructor correctness.
as_ptr_cast_mut = "deny"
as_pointer_underscore = "deny"
borrow_as_ptr = "deny"
cast_ptr_alignment = "deny"
mem_forget = "deny"
missing_safety_doc = "deny"
ptr_as_ptr = "deny"
ptr_cast_constness = "deny"
ref_as_ptr = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

# Integer overflow is a defect in every profile. Intentional modular or
# saturating arithmetic uses explicit operations.
[profile.release]
overflow-checks = true

# The competitors build as their users build them for release, without overflow checks. The
# members of this workspace keep the checks in the benchmarks too.
[profile.bench.package."*"]
overflow-checks = false
