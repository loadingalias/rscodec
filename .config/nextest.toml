nextest-version = { required = "0.9.150", recommended = "0.9.150" }

[profile.default]
retries = 0
flaky-result = "fail"
success-output = "never"
failure-output = "immediate-final"
fail-fast = true
slow-timeout = { period = "10s", terminate-after = 3 }

[profile.ci]
inherits = "default"
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
report-skipped = "none"
flaky-fail-status = "failure"

[[profile.default.overrides]]
filter = "test(float_sweep)"
slow-timeout = { period = "60s", terminate-after = 60 }
