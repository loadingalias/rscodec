# The CI gate on each push to main: `cargo xtask check`, then the tests with
# `std` and without it and the doctests, then the tests on wasm32-wasip1 in
# Wasmtime, without simd128 and with it.
#
# Each version comes from a file that `machine update all` writes:
# rust-toolchain.toml, .config/nextest.toml, and Cargo.lock. A pin change
# reaches CI with the next commit, and it changes the cache keys. Wasmtime is
# the exception: its step holds the version of ~/machine/tools.txt.
#
# The tests use the `ci` profile of .config/nextest.toml through
# NEXTEST_PROFILE, not a `--profile` argument: `cargo xtask test` runs the
# doctests only when it has no arguments.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  RUSTUP_AUTO_INSTALL: "0"
  # The simd128 build of the wasm32 lane. `cargo xtask test` removes RUSTFLAGS,
  # so the flag goes through the Cargo configuration.
  SIMD128: 'target.wasm32-wasip1.rustflags=["-C","target-feature=+simd128"]'

jobs:
  check:
    name: check
    # .github/runs-on.yml sets the runner size. extras=s3-cache selects Magic
    # Cache: actions/cache keeps its entries in the S3 bucket of the stack.
    runs-on: runs-on=${{ github.run_id }}/runner=linux-x64-ci/env=production/extras=s3-cache
    timeout-minutes: 20
    steps:
      # Magic Cache needs this step before the first cache step.
      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The shell calculates the keys, as in top-secret: hashFiles() does not
      # work on the RunsOn minimal images.
      - name: Cache keys
        id: keys
        shell: bash
        run: |
          set -euo pipefail
          sum() { cat "$@" | sha256sum | cut -c1-16; }
          toolchain=$(sum rust-toolchain.toml)
          # The steps of this file choose what the target directory holds, so
          # a change of them saves a new entry.
          {
            echo "tooling=tooling-$RUNNER_ARCH-$(sum rust-toolchain.toml .config/nextest.toml)"
            echo "build=build-$RUNNER_ARCH-$toolchain-$(sum Cargo.lock .github/workflows/ci.yml)"
            echo "build-prefix=build-$RUNNER_ARCH-$toolchain-"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Rust and cargo-nextest
        id: tooling
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
          key: ${{ steps.keys.outputs.tooling }}

      # Before the install: Cargo finds rustc through this path.
      - name: Put Cargo on the path
        shell: bash
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The image is the pin for system packages.
      - name: System packages
        shell: bash
        run: |
          set -euo pipefail
          packages=(build-essential ca-certificates curl xz-utils)
          dpkg -s "${packages[@]}" > /dev/null 2>&1 && exit 0
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "${packages[@]}"

      # rustup as `machine install` installs it, the toolchain of
      # rust-toolchain.toml, and cargo-nextest at the version of
      # .config/nextest.toml from its crates.io source with --locked.
      - name: Install Rust and cargo-nextest
        if: steps.tooling.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
          rustup toolchain install
          version=$(sed -nE 's/^nextest-version = \{ required = "([^"]+)".*/\1/p' .config/nextest.toml)
          test -n "$version"
          # A separate Cargo home keeps the sources of cargo-nextest out of the build cache.
          CARGO_HOME="$RUNNER_TEMP/tool-home" cargo install \
            --locked --root "$HOME/.cargo" "cargo-nextest@$version"

      - name: Restore the Cargo registry and the target directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.keys.outputs.build }}
          restore-keys: ${{ steps.keys.outputs.build-prefix }}

      - name: cargo xtask check
        shell: bash
        run: cargo xtask check

      # The tests of the JSON kernels read the corpora that benches/data/README.md
      # fetches.
      - name: Fetch the corpora
        shell: bash
        working-directory: benches/data
        run: |
          set -euo pipefail
          mkdir -p fetched
          for name in twitter citm_catalog canada; do
            curl -fsSL -o "fetched/$name.json" \
              "https://raw.githubusercontent.com/simdjson/simdjson-data/4197c425e857f0ec38e89822fdd0bd9ea21f4daf/jsonexamples/$name.json"
          done
          sha256sum -c corpora.sha256

      # The number tests read Nigel Tao's data, which tests/data/README.md fetches.
      - name: Fetch the number data
        shell: bash
        working-directory: tests/data
        run: |
          set -euo pipefail
          mkdir -p fetched/numbers
          for name in exhaustive-float16 freetype-2-7 google-double-conversion google-wuffs ibm-fpgen \
            lemire-fast-double-parser lemire-fast-float more-test-cases remyoudompheng-fptest-0 \
            remyoudompheng-fptest-1 remyoudompheng-fptest-2 remyoudompheng-fptest-3 tencent-rapidjson \
            ulfjack-ryu; do
            curl -fsSL --compressed -o "fetched/numbers/$name.txt" \
              "https://raw.githubusercontent.com/nigeltao/parse-number-fxx-test-data/55d79b184b7d8fac2e143e89dc19b766ec4e54b8/data/$name.txt"
          done
          sha256sum -c numbers.sha256

      - name: cargo xtask test
        shell: bash
        run: cargo xtask test

      # The runner of wasm32-wasip1 in .cargo/config.toml. The SHA-256 is the
      # digest that GitHub publishes for the archive.
      - name: Install Wasmtime
        shell: bash
        env:
          WASMTIME_VERSION: 50.0.1
          WASMTIME_SHA256: 685466455dd42a14774a86c36c8f2e45cbb9bd6d92a850139315df60a75498a5
        run: |
          set -euo pipefail
          name="wasmtime-v$WASMTIME_VERSION-x86_64-linux"
          curl -fsSL -o "$RUNNER_TEMP/$name.tar.xz" \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v$WASMTIME_VERSION/$name.tar.xz"
          echo "$WASMTIME_SHA256  $RUNNER_TEMP/$name.tar.xz" | sha256sum -c
          tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

      - name: cargo xtask test on wasm32-wasip1
        shell: bash
        run: cargo xtask test --target wasm32-wasip1

      - name: cargo xtask test on wasm32-wasip1 with simd128
        shell: bash
        run: cargo xtask test --target wasm32-wasip1 --config "$SIMD128"

      # Wasmtime without SIMD refuses a binary that holds a SIMD instruction.
      # Thus a test binary that it compiles holds no simd128 kernel.
      - name: Each simd128 test binary holds the simd128 kernels
        shell: bash
        run: |
          set -euo pipefail
          binaries=$(cargo xtask test --target wasm32-wasip1 --config "$SIMD128" -p rscodec \
            --no-run --cargo-message-format json | grep -o '"executable":"[^"]*"' | cut -d'"' -f4)
          test -n "$binaries"
          for binary in $binaries; do
            if wasmtime compile -W simd=n,relaxed-simd=n -o /dev/null "$binary" 2> "$RUNNER_TEMP/refusal.txt"; then
              echo "::error::$binary holds no simd128 kernel"
              exit 1
            fi
            grep -q 'Invalid input WebAssembly code' "$RUNNER_TEMP/refusal.txt"
            echo "$binary: refused without SIMD"
          done
