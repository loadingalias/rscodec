# Keep libFuzzer and its compiler flags outside the library workspace.
[package]
name = "rscodec-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
rscodec = { path = "..", features = ["json"] }
# Compare correctly rounded floats and check overflow syntax before converting the number.
serde_json = { version = "=1.0.154", features = ["float_roundtrip", "raw_value"] }

# build.rs builds simdjson, the second trusted reader, with its shim `oracle.cpp`.
[build-dependencies]
cc = "=1.11.1"

[[bin]]
name = "read"
path = "fuzz_targets/read.rs"
doc = false
bench = false

[workspace]

# Integer overflow is a defect in every profile, also in the fuzz build.
[profile.release]
debug = 1
overflow-checks = true
