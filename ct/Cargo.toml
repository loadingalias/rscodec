[package]
name = "rscodec-ct"
version = "0.0.0"
description = "Instruction scans, path counts, stack checks, and timing tests for secret codec operations."
edition.workspace = true
license.workspace = true
publish = false

[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
rscodec = { path = "..", features = ["base64", "hex", "json"] }

