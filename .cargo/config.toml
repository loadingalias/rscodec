[alias]
xtask = ["run", "--quiet", "--locked", "--package", "xtask", "--"]
# Zed runs contextual tests through Nextest with this name (.zed/settings.json).
nextest-run = ["nextest", "run"]

# Wasmtime needs directory access to read the test corpora.
[target.wasm32-wasip1]
runner = ["wasmtime", "--dir", "."]
